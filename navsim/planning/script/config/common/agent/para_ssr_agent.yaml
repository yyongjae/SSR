_target_: navsim.agents.para_ssr.para_ssr_agent.ParaSSRAgent
_convert_: 'all'

config:
  _target_: navsim.agents.para_ssr.configs.default.ParaSSRConfig
  _convert_: 'all'

  # --- shared BEV encoder -------------------------------------------------
  # SSR axes: x is right, y is forward.  All heads share this front-only ROI:
  # x in [-32, 32] m, y in [0, 32] m.  The dataclass owns both range values.
  # 50 rows over 32 m forward x 100 columns over 64 m lateral: square 0.64 m
  # cells, the BEVFusion teacher's 50 x 100 grid (teacher_cache/*_50x100).
  bev_h: 50
  bev_w: 100
  embed_dims: 256
  encoder_num_layers: 3
  # Status conditions planning only; shift + cached yaw warp history BEV.
  use_shift: true
  use_ego_motion: false
  use_grid_mask: true
  # Keep ImageNet initialization for fresh training.  Checkpoint-only
  # evaluators set this false because strict loading replaces every weight.
  backbone_pretrained: true

  # --- input --------------------------------------------------------------
  # navsim gives history frames 0..3; 3 is the current one and must come last.
  # A longer queue costs one image load + one no-grad BEV pass per extra frame.
  frame_indices: [2, 3]
  # WoTE's three front cameras; separate calibrated views for BEVFormer.
  camera_names: [cam_f0, cam_l0, cam_r0]
  # 1920x1080 * 0.4 -> 768x432, then drop 16 rows of sky -> 768x416
  image_scale: 0.4
  crop_top: 16

  # --- LiDAR (SafeDrive wiring) -------------------------------------------
  # The merged point cloud at each history frame is clipped to the front ROI
  # and encoded to a [256, 50, 100] BEV that seeds the BEV queries and is
  # read by a gated deformable cross-attention in every encoder layer.
  # lidar_encoder: "sparse" = SafeDrive's SpMiddleResNetFHD (needs spconv:
  # pip install spconv-cu126); "pillar" = spconv-free fallback.
  # sparse voxels must be cell / 8 = 0.08 m; pillars must divide the 0.64 m
  # cell by one power of two on both axes.
  use_lidar: false
  lidar_encoder: sparse
  lidar_max_points: 65536
  lidar_z_range: [-3.0, 5.0]
  lidar_voxel_size: [0.08, 0.08, 0.2]
  lidar_pillar_size: [0.16, 0.16]
  lidar_pillar_channels: 64
  lidar_backbone_channels: [64, 128, 256]
  lidar_backbone_layers: [3, 5, 5]
  lidar_neck_channels: 128
  lidar_attn_points: 8

  # --- planner ------------------------------------------------------------
  # Interaction on: BEV -> parallel det/motion + map -> sum -> FFN.
  # Interaction off: BEV -> FFN.
  # With interaction off, head flags select parallel multi-task or plan-only.
  use_stl: false
  use_task_interaction: true
  plan_num_layers: 3

  # --- heads --------------------------------------------------------------
  use_det_motion_head: true
  use_map_head: true
  num_query: 300
  # Half-angle about the forward axis; shared by training and auxiliary mAP GT.
  det_fov_half_angle_deg: 80.0
  map_num_vec: 100
  test_aux_heads: false

  # --- PARA-Drive wiring --------------------------------------------------
  task_loss_weight:
    # Restores the commanded x/y coefficient after (3 modes x 2 dims) became
    # (4 modes x 3 dims). This does not remove the new heading objective.
    plan: 2.0
    det: 1.0
    motion: 1.0
    map: 1.0
  # Closed-loop control of each task's gradient share at the shared BEV.
  # Retain the existing target; planning now includes both memory paths.
  # Set to null to train the unscaled reference. Interaction requires both
  # heads; without it, absent tasks are removed from the balancer.
  grad_balance_target:
    plan: 0.4
    det: 0.3
    map: 0.3
  # These count MICRO-batches (one per compute_loss call), not optimiser steps.
  # accumulate_grad_batches=16 means one optimiser step is 16 of them, so the
  # nuScenes config's 500 does NOT transfer -- it would fire after 31 optimiser
  # steps, deep inside the 3-epoch LR warm-up, and the first measurement is
  # adopted without smoothing.  10600 is one epoch at 2 GPUs x batch 4.
  grad_balance_warmup_iters: 10600
  grad_balance_interval: 200
  grad_norm_log_interval: 200

  # --- planning-readout distillation (report/19) ---------------------------
  # Off by default.  kd_mode: none | readout | random | feature | attn_feature | sens_feature.
  # map_label_source: gt | teacher (map head supervised by ReSMap predictions).
  kd_mode: none
  kd_teacher_cache: null
  kd_readout_ckpt: null
  kd_distance: cosine
  kd_weight: 1.0
  kd_warmup_iters: 0
  kd_ramp_iters: 0
  kd_adapter: false
  # none | global | command: z에서 장면과 무관한 성분(command별 평균)을 빼고 거리를 잰다.
  kd_center: none
  kd_center_momentum: 0.99
  kd_random_seed: 0
  kd_sens_probes: 4
  # Image backbone (timm tag).  v1 = resnet50.tv_in1k; v2 uses resnet34.tv_in1k,
  # the NAVSIM-standard ResNet-34 (TransFuser / WoTE / DiffusionDrive).
  image_architecture: resnet50.tv_in1k
  # v2 planner: WoTE-style anchors + PDM-score rewards (modules/anchor_planner.py).
  plan_anchor: false
  plan_anchor_file: null
  plan_score_file: null
  plan_reward_weights: [0.1, 0.5, 0.5, 1.0]
  plan_topk: 6
  plan_kinematic: false
  plan_heading_from_xy: false
  plan_rescore_refined: false   # evaluation-only: WoTE-style rescoring of anchor + offset
  plan_offset_loss_weight: 1.0
  plan_im_reward_weight: 1.0
  plan_sim_reward_weight: 1.0
  heading_from_path: false   # evaluation-only: heading := path direction
  kinematic_projection: false   # evaluation-only: TOAD projection (IK -> clamp -> bicycle rollout)
  # Planning-side map consistency (plan_map.py); 0 = off.
  plan_map_weight: 0.0
  plan_map_margin: 0.0
  plan_map_extent: [-8.0, 72.0, -32.0, 32.0]
  plan_map_res: 0.25
  plan_map_clip: 10.0
  map_label_source: gt
  map_pseudo_score_thr: 0.3
  # Drivable-area RASTER on the shared BEV grid (bev_seg.py); 0 = off, nothing constructed.
  # The vector map head keeps running -- this adds the region DAC tests, not a replacement.
  bev_seg_weight: 0.0
  bev_seg_hidden: 128
  bev_seg_pos_weight: 1.0
  # vector | seg.  seg replaces the polyline head with the raster head (needs bev_seg_weight > 0).
  map_head_type: vector
  bev_seg_token_pool: 5
  # Feasibility cost on the 256 refined candidates (feasibility.py); 0 = off.
  feas_weight: 0.0
  feas_field: gt            # gt | pred
  feas_field_head: true
  feas_to_offset: true
  feas_to_score: false
  feas_weighting: softmax   # softmax | topk | uniform | select
  feas_temp: 1.0
  feas_topk: 32
  feas_margin: 0.4
  feas_beta: 0.2
  feas_clip: 8.0
  feas_offset_weight: 1.0
  feas_score_weight: 1.0
  feas_score_tau: 0.5
  feas_dyn_weight: 0.0      # >0 turns on the per-step agent field (NC); needs agent_sdf_bev
  feas_dyn_margin: 0.2
  feas_select_label_k: 16    # feas_weighting=select: anchors refined by label rank
  feas_select_model_k: 16    # ... and by the model's own rank
  feas_offset_anchor_weight: 0.0   # >0: hold candidates outside the refined set within the radius of their anchor
  feas_offset_anchor_radius: 2.0
  feas_ttc_target: anchor    # anchor | geometric | band | hybrid (feasibility.ttc_label)
  feas_ttc_margin: 0.0
  feas_ttc_band_lo: 2.0      # band: geometric TTC label where the candidate's mean |offset| is in [lo, hi)
  feas_ttc_band_hi: 12.0
  feas_ep_target: anchor     # anchor | geometric (feasibility.ep_label)
  feas_progress_weight: 0.0  # feasibility.drive_terms: push S candidates up to the human's route progress
  feas_lateral_weight: 0.0   # ... resisted by lane deviation beyond feas_lateral_free m
  feas_lateral_free: 1.0
  feas_continuity_weight: 0.0   # ... and by a first-step speed that does not continue the current motion
  feas_continuity_tol: 0.5
  # stage 2 (refine.py): refine ONLY the selected candidate (select, then refine)
  feas_field_priors: false   # field head reads the seg head's drivable prob + det/motion forecast occupancy
  feas_prior_topk: 40
  rank_weight: 0.0          # listwise top-1 ranking inside the corridor (feasibility.admissible_rank_loss)
  rank_set: gate            # gate (deployment field-gate set, full label) | corridor (GT set) | all (control)
  rank_tau: 0.05
  rank_temp: 1.0
  curse_weight: 0.0
  curse_set: topk
  curse_topk: 8
  curse_tau: 0.2
  finetune_score_only: false   # train only the score heads; the rest frozen and in eval mode
  finetune_refiner_only: false # train only stage 2 (refiner); the rest frozen and in eval mode
  refine_enable: false
  refine_weight: 1.0
  refine_hidden: 256
  refine_margin: 0.4
  refine_dyn_margin: 0.2
  refine_corridor_weight: 1.0
  refine_corridor_hinge: false
  refine_progress_weight: 1.0
  refine_lateral_weight: 0.1
  refine_lateral_free: 1.0
  refine_smooth_weight: 1.0
  refine_trust_weight: 0.05
  refine_continuity_weight: 0.5
  refine_continuity_tol: 0.5
  refine_imitation_weight: 1.0
  refine_ttc_weight: 0.0   # do-no-harm on the pick's TTC clearance to other agents
  refine_ttc_margin: 1.0
  refine_fallback: true   # inference: discard a refinement that leaves the corridor the pick was inside
  refine_apply: true      # evaluation: false emits stage 1's pick unrefined (isolates stage 2)
  # BEV selector v7 distillation (teammate's, docs/bev_selector_v7.md on origin/aux_distill), training only
  distill_v7: false
  distill_v7_weight: 1.0
  distill_v7_root: /home/external-user/datasets/teacher_cache
  distill_v7_resmap_flip: false   # teammate flips ReSMap L/R; measured mirrored (distill/teacher_store.py)
  distill_v7_heads: 4
  distill_spatial_sigma: 4.0
  distill_attn_loss_scale: 5.0
  distill_resmap_scale: 3.0
  distill_anchor_winner_boost: 2.0
  distill_anchor_tau: 1.0
  distill_anchor_loss_scale: 10.0
  distill_anchor_loss_type: hybrid
  distill_anchor_proj: true
  feas_route_file: ""        # packed route centerlines (tools/plan_v2/dump_route_centerline.py), no .npy suffix
  feas_route_max_offset: 5.0   # a route farther than this from the ego is a failed extraction -> treated as no route
  feas_select_gate: false    # INFERENCE only: gate candidates on the predicted field itself, not the head
  feas_select_margin: 0.1
  feas_select_dyn_margin: 0.0
  feas_field_weight: 1.0
  feas_hidden: 128
  feas_target_upsample: 4   # GT field grid = bev x4 (0.16 m); the predicted field stays on the BEV grid
  plan_head_mode: wote
  plan_score_sees_offset: false   # score heads also see the candidate's (detached) offset
  plan_offset_hold_weight: 0.0
  plan_offset_hold_radius: 1.0
  plan_select_mode: weighted   # weighted | corridor_first
  plan_select_dac_thr: 0.5
  plan_select_gate: 20.0
  feas_ground_band: 1.0
  feas_ground_floor: 0.05
  feas_cost_grad_to_field: false
  feas_warmup_iters: 0
  feas_ramp_iters: 0

  # --- optimisation (WoTE/SeerDrive recipe, report #09 4) -----------------
  training_precision: 32
  max_epochs: 30
  warmup_epochs: 3
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  backbone_lr_mult: 0.1
  optimizer_type: AdamW

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5

checkpoint_path: null
resume_from_checkpoint: false

# NOTE: 1e-4 was tuned at WoTE's global batch 128. The default 2-GPU launch
# reproduces it with 4/GPU x accumulate 16; see report #09.
lr: 1.0e-4
