# BEV-register distillation. Adds selector losses on the current student.
# Stage-1 adapters and GradBalancer stay on the v4 launcher
# (scripts/training/run_all_stages_distill.sh, agent=para_ssr_distill_agent).
#
#   bash ./scripts/training/run_bev_selector_distill.sh
defaults:
  - para_ssr_distill_agent
  - _self_

config:
  # Interaction-branch student is resnet50.tv_in1k. This run uses ResNet-34.
  image_architecture: resnet34.tv_in1k
  distill_selector: true
  distill_selector_registers: 16
  distill_selector_div_sigma: 4.0
  distill_selector_tok_warmup_steps: 53195
  # v3: per-cell match, sharpened planner cover, log-gaussian anchor.
  # See docs/bev_selector_v3.md. Student graph is unchanged.
  distill_selector_anchor_sigma: 6.0
  distill_selector_anchor_sigma_end: 2.0
  distill_selector_plan_tau: 0.3
  distill_selector_struct_mix: 0.5
  use_corridor_mask: false
  distill_use_role_masks: false
  distill_mse_weight: 0.0
  distill_plan_look_weight: 0.0
  distill_head_kd_weight: 0.0
  # Unscaled task gradients. The 0.4/0.3/0.3 valve stays the v4 default.
  grad_balance_target: null
