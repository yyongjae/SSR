# BEV Selector v11: PARA-SSR v2 Student Multi-Task + Pure PGP-Weighted Pointwise 1x1 Cell KD
# - Student: km/para-ssr-v2 full multi-task architecture (ResNet-34) + optional CK2 Refiner v2 E2E
# - Distill v11 (docs/bev_selector_v11.md):
#     * Fix 1 (Pure PGP-Weighted Pointwise 1x1 Cell Alignment — Zero Gradient Cannibalization):
#       The Domain-Specific Planning-Grounded Probe (PGP) is trained exclusively on Teacher BEV to produce
#       spatial importance maps w_pgp(u) = 0.5 + 0.5 * m_norm(u). Student pooled feat_loss and attn_loss (KL)
#       are detached (logged strictly as diagnostic telemetry), routing 100% of student_proj and RatioController
#       BEV gradient budget (10% of gnorm/plan per teacher) into pointwise cell alignment (w_pgp * ||s_bev - t_bev||^2).
#     * Fix 2 (Zero-Initialized 1x1 Student Projection Adapter + 2.0x LR + Zero Weight Decay):
#       student_proj weights and biases are initialized to 0.0 (matching ck/bev_kd.py init="zero") and optimized
#       in a dedicated param group with 2.0x LR and weight_decay=0.0, eliminating arbitrary identity-init bias
#       and fitting the linear projection rapidly during the probe warm-up window.
#     * Fix 3 (Domain-Specific Risk Exploration Anchor Weighting — w_det vs w_map):
#       Separates anchor importance weights by domain (DET: (1 - NC * TTC) * (0.5 + 0.5 * DAC); MAP: 1 - DAC)
#       and widens exploration across adjacent lanes/intersections (lambda_gt=0.30, lambda_risk=0.55, lambda_cov=0.15,
#       tau_gt=4.0, tau_risk=8.0 -> N_eff ~ 110 anchors, ~5.0m exploration radius).
defaults:
  - para_ssr_distill_agent
  - _self_

config:
  # Student architecture (ResNet-34 camera backbone)
  image_architecture: resnet34.tv_in1k

  # km/para-ssr-v2 Student Multi-Task Configuration
  use_task_interaction: true
  use_det_motion_head: true
  use_map_head: true
  plan_anchor: true
  plan_anchor_file: /workspace/byounggun/SSR/data/planning_vb/trajectory_anchors_256.npy
  plan_score_file: /workspace/byounggun/SSR/data/planning_vb/pdm_score_256
  plan_heading_from_xy: true

  # Task Gradient Balancing (Closed-loop balancer across Plan, Det, Map)
  grad_balance_target:
    plan: 0.4
    det: 0.3
    map: 0.3
  grad_balance_warmup_iters: 10600
  grad_balance_interval: 200

  # v11 Pure PGP-Weighted Pointwise 1x1 Cell Distillation
  distill_selector: false
  distill_selector_v6: false
  distill_selector_v7: false
  distill_selector_v8: false
  distill_selector_v9: false
  distill_selector_v10: false
  distill_selector_v11: true
  distill_spatial_sigmas: [2.0, 4.0, 8.0, 16.0]
  distill_lambda_gt: 0.30
  distill_lambda_cov: 0.15
  distill_lambda_risk: 0.55
  distill_tau_gt: 4.0
  distill_tau_risk: 8.0
  distill_attn_loss_scale: 5.0
  distill_resmap_scale: 3.0
  distill_anchor_loss_scale: 10.0
  distill_anchor_loss_type: hybrid
  distill_anchor_proj: true
  distill_anchor_mode: cross_attn
  distill_probe_warmup_steps: 1000
  distill_probe_ramp_steps: 2000
  distill_probe_loss_weight: 0.5
  distill_probe_lr_mult: 3.0
  distill_proj_lr_mult: 2.0
  distill_probe_use_ema: true
  distill_probe_ema_decay: 0.99

  # Legacy distill options turned off
  use_corridor_mask: false
  distill_use_role_masks: false
  distill_mse_weight: 0.0
  distill_plan_look_weight: 0.0
  distill_head_kd_weight: 0.0
