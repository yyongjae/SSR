hydra:
  job:
    chdir: true
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common 
    # - pkg://navsim.planning.script.config.pdm_scoring
    # - pkg://navsim.planning.script.config.training

defaults:
  - default_common
  - default_evaluation
  - default_train_val_test_log_split
  - agent: ego_status_mlp_agent
  - _self_

split: trainval

# Checkpointing. Lightning's implicit default keeps only the newest epoch
# (monitor=null, save_top_k=1 -> one file, overwritten), which makes it
# impossible to go back to an earlier epoch after a multi-day run.  The
# nuScenes config kept every epoch (checkpoint_config interval=1,
# max_keep_ckpts=total_epochs); this reproduces that.
checkpoint:
  every_n_epochs: 1
  save_top_k: -1      # -1 keeps every epoch; set a positive N to prune
  save_last: true     # extra 'last.ckpt' for resuming
  # MUST stay true. Lightning resolves save_on_train_epoch_end=null to FALSE
  # whenever a validation loop exists, so checkpoints would only be written on
  # validation epochs -- with check_val_every_n_epoch=5 that is 6 files over a
  # 30-epoch run, not 30.
  save_on_train_epoch_end: true

# Weights & Biases. Off by default so a run never blocks on a login.
# Enable with:  wandb.enable=true
# W&B runs ALONGSIDE TensorBoard and is fail-open: an SDK/service failure
# disables telemetry for the process instead of killing a DDP rank.
wandb:
  enable: false
  project: para-ssr
  name: null          # null -> experiment_name
  group: null
  tags: null
  entity: null
  mode: online        # online | offline | disabled
  exclude: []         # metric tags to keep off the W&B dashboard only
  non_fatal: true     # false only when deliberately debugging W&B itself
# cache_path: ${oc.env:NAVSIM_EXP_ROOT}/training_cache
cache_path: '' #no cache
use_cache_without_dataset: false # load the training samples from the cache. scene-filter will be ignored
force_cache_computation: false
# Full Lightning resume (model, optimizer, scheduler, epoch and global step).
# This is intentionally separate from agent.checkpoint_path, which is a
# weights-only warm start used by evaluation.
resume_checkpoint: null

dataloader:
  params:
    batch_size: 32  # number of samples per batch
    num_workers: 4  # number of workers for data loading
    pin_memory: true  # pin memory for faster GPU transfer
    prefetch_factor: 2  # number of samples loaded in advance by each worker

trainer:
  params:
    max_epochs: 20  # maximum number of training epochs
    check_val_every_n_epoch: 5  # run validation set every n training epochs
    val_check_interval: 1.0  # [%] run validation set every X% of training set

    limit_train_batches: 1.0  # how much of training dataset to check (float = fraction, int = num_batches)
    limit_val_batches: 1.0  # how much of validation dataset to check (float = fraction, int = num_batches)

    accelerator: gpu  # distribution method
    strategy: ddp
    precision: 16-mixed  # floating point precision
    num_nodes: 1  # Number of nodes used for training

    num_sanity_val_steps: 0  # number of validation steps to run before training begins
    fast_dev_run: false  # runs 1 batch of train/val/test for sanity

    accumulate_grad_batches: 1  # accumulates gradients every n batches
    # track_grad_norm: -1  # logs the p-norm for inspection
    gradient_clip_val: 0.0  # value to clip gradients
    gradient_clip_algorithm: norm  # [value, norm] method to clip gradients
