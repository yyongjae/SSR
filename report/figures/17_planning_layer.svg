   </g>
   <g id="text_21">
    <text style="fill: #15263c; font: 700 11.3px 'DejaVu Sans'; text-anchor: middle" x="957.6" y="331.866234" transform="rotate(-0 957.6 331.866234)">FFN</text>
   </g>
   <g id="text_22">
    <text style="fill: #15263c; font: 10.7px 'DejaVu Sans'" transform="translate(921.476633 357.338894)">Pre-LN → MLP</text>
    <text style="fill: #15263c; font: 10.7px 'DejaVu Sans'" transform="translate(907.826609 372.166168)">+ merged residual</text>
   </g>
   <g id="text_23">
    <text style="fill: #15263c; font: 700 11.4px 'DejaVu Sans'; text-anchor: middle" x="334.8" y="601.942219" transform="rotate(-0 334.8 601.942219)">Task attention inputs</text>
   </g>
   <g id="text_24">
    <text style="fill: #15263c; font: 10.8px 'DejaVu Sans'" transform="translate(183.567937 640.680792)">Q = branch_query_norm(h_bev) + learned plan position</text>
    <text style="fill: #15263c; font: 10.8px 'DejaVu Sans'" transform="translate(190.285031 655.947014)">K = memory_norm(memory) + position + confidence</text>
    <text style="fill: #15263c; font: 10.8px 'DejaVu Sans'" transform="translate(256.997813 671.213236)">V = memory_norm(memory)</text>
    <text style="fill: #15263c; font: 10.8px 'DejaVu Sans'" transform="translate(162.0135 686.479458)">Separate query norms; neither branch reads the sibling update.</text>
   </g>
   <g id="text_25">
    <text style="fill: #15263c; font: 700 11.2px 'DejaVu Sans'; text-anchor: middle" x="961.2" y="601.79025" transform="rotate(-0 961.2 601.79025)">Content and metadata paths</text>
   </g>
   <g id="text_26">
    <text style="fill: #15263c; font: 10.6px 'DejaVu Sans'" transform="translate(795.020156 641.491885)">Latents → pooling / projection → K and V (gradients preserved)</text>
    <text style="fill: #15263c; font: 10.6px 'DejaVu Sans'" transform="translate(803.766813 656.180587)">Predicted position / score → detach → learned MLP → K only</text>
    <text style="fill: #15263c; font: 10.6px 'DejaVu Sans'" transform="translate(779.600469 670.869288)">No gate or learned merger; task memories are reused across layers.</text>
    <text style="fill: #15263c; font: 10.6px 'DejaVu Sans'" transform="translate(788.945031 685.55799)">Parallel branches describe the graph, not GPU kernel scheduling.</text>
   </g>
